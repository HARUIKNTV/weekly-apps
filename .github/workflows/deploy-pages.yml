name: Deploy Weekly Apps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build each app for web
        run: |
          mkdir -p site
          shopt -s nullglob
          for dir in apps/*/; do
            name=$(basename "$dir")
            if [ -f "$dir/package.json" ]; then
              echo "== Building $name =="
              (cd "$dir" && npm install && npx expo export -p web --output-dir "$GITHUB_WORKSPACE/site/$name")
            fi
          done

      - name: Generate index page
        run: node scripts/generate-index.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
